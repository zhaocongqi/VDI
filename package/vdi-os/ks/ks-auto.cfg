# VDI 平台自动装机测试 Kickstart（无人值守，跳过 GUI 交互）
#
# 与产线 ks.cfg 的区别：
# - cmdline 模式（无 GUI）
# - 预设 rootpw（跳过密码 Spoke）
# - %addon vdi 带默认参数（DHCP + 单网卡）

cmdline
cdrom
keyboard --vckeymap=us --xlayouts='us'
lang zh_CN.UTF-8
timezone Asia/Shanghai --isUtc --utc
selinux --permissive
firewall --disabled
reboot --eject
rootpw vdi123
sshpw --username=root vdi123

network --bootproto=dhcp --device=link --activate

ignoredisk --only-use=vda
clearpart --all --initlabel
autopart --type=lvm --fstype=ext4
bootloader --append="console=ttyS0,115200 console=tty1"

%addon vdi --mode=single --interface=enp0s2 --network-mode=dhcp --role=first-master --token=vdi-cluster-secret --bond1-enabled=true --bond1-interface=enp0s4 --bond1-interface2=enp0s5 --bond1-bond-mode=active-backup --bond1-network-mode=static --bond1-ip=192.168.20.10 --bond1-netmask=255.255.255.0 --default-route-iface=enp0s2
%end

%packages
@core
@base
iptables
iproute
ipset
ebtables
net-tools
bind-utils
nfs-utils
policycoreutils-python-utils
open-iscsi
-firmware-*
-iwl*-firmware
%end
