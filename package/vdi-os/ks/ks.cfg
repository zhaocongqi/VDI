# VDI 平台系统引导安装 Kickstart 模板
#
# BCLinux DVD ISO 引导后会首先进入此脚本。在 %pre 阶段，我们仅向 /tmp/ks-include.cfg
# 写入基础配置，随后由 %include 彻底接管装机。
#
# ⚠️ 时序红线（踩坑修复）：%include 必须在 ks 最顶部（%pre 之前）。
# anaconda 解析 ks 时先标记 %include 延迟展开 → 跑 %pre 生成 /tmp/ks-include.cfg
# （含 text/cdrom/network/ignoredisk/%packages/%post 等全局指令与 section）
# → 展开 %include（全局指令现在落在 ks 顶部正确位置）。
# 若 %include 放在 %pre 之后，ks-include 的全局指令会落到 %pre 之后，违反 kickstart
# "全局指令必须在所有 section 之前"的语法，导致 anaconda 解析异常：%packages 仍装包
# 但 %post 段全部静默不执行（实测 rke2/sshd/数据盘无一落地，root 锁定无法登录）。

%include /tmp/ks-include.cfg

%pre --interpreter=/bin/bash
echo ">>> [pre] VDI 预检开始" > /dev/ttyS0
# 仅生成最基础的默认 kickstart 配置段做 Anaconda 兜底启动
echo "autostep --check" > /tmp/ks-include.cfg
echo ">>> [pre] VDI 预检结束" > /dev/ttyS0
%end
