# VDI 平台系统引导安装 Kickstart 配置文件
#
# 本文件已完全退化为“纯静态”标准 Kickstart 配置。
# 它规定了基础的 LVM 磁盘分区、软件包选择与图形化装机源，
# 所有的动态网络绑定、密码覆写与 RKE2 离线装配已完全收编到 
# Python Addon (%addon vdi) 的 execute 生命周期中执行，绝不依赖易丢失的 %post 多段。

graphical
cdrom
keyboard --vckeymap=us --xlayouts='us'
lang zh_CN.UTF-8
timezone Asia/Shanghai --isUtc --utc
selinux --permissive
firewall --disabled
reboot --eject

# 默认激活 DHCP 拿临时地址供引导期校验与 sshd 连接
network --bootproto=dhcp --device=link --activate

# 磁盘 LVM 自动分区逻辑（只清主盘，数据盘原样保留供 execute 单独格式化挂载）
clearpart --all --initlabel
autopart --type=lvm --fstype=ext4
bootloader --append="console=ttyS0,115200 console=tty1"

# 默认锁定 root 密码，由 VdiAddon 在 execute 阶段根据 GUI 配置进行 shadow 强制覆写
rootpw --lock

# 激活我们的 VDI 定制插件
%addon vdi
%end

# 基础装包组说明
%packages
@core
@base
iptables
iproute
ipset
ebtables
net-tools
bind-utils
nfs-utils
policycoreutils-python-utils
open-iscsi
-firmware-*
-iwl*-firmware
%end
