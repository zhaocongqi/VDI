# VDI 平台系统引导安装 Kickstart 配置文件
#
# 本文件已完全退化为“纯静态”标准 Kickstart 配置。
# 它规定了基础的 LVM 磁盘分区、软件包选择与图形化装机源，
# 所有的动态网络绑定、密码覆写与 sealer/kubeadm 离线装配已完全收编到
# Python Addon (%addon vdi) 的 task queue 生命周期中执行，绝不依赖易丢失的 %post 多段。

graphical
cdrom
keyboard --vckeymap=us --xlayouts='us'
lang zh_CN.UTF-8
timezone Asia/Shanghai --isUtc --utc
selinux --permissive
firewall --disabled
reboot --eject

# 默认激活 DHCP 拿临时地址供引导期校验与 sshd 连接
network --bootproto=dhcp --device=link --activate

# 磁盘 LVM 自动分区逻辑（只清主盘，数据盘原样保留供 Addon Task 单独格式化挂载）
# ignoredisk --only-use 限定 anaconda 只使用首盘（系统盘），数据盘
# 不被 clearpart/autopart 触碰，保持裸盘供 Addon 格式化挂载（/apps、/var/lib/longhorn）
ignoredisk --only-use=vda
clearpart --all --initlabel
autopart --type=lvm --fstype=ext4
bootloader --append="console=ttyS0,115200 console=tty1"

# 不预设 root 密码，由用户在 anaconda Hub 的 Root 密码 Spoke 交互设定
# rootpw 不声明 → Hub 要求用户必须配置，否则不允许开始安装

# 激活我们的 VDI 定制插件
%addon vdi
%end

# 基础装包组说明
%packages
@core
@base
iptables
iproute
ipset
ebtables
net-tools
bind-utils
nfs-utils
policycoreutils-python-utils
open-iscsi
-firmware-*
-iwl*-firmware
%end
